name: Golden Path

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up repository validation runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked validation dependencies
        run: npm ci --ignore-scripts
      - name: Validate contracts and repository structure
        run: npm run validate
      - name: Detect authority transitions against base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            npm run validate -- --base "$BASE_SHA"
          else
            echo "No prior revision for this event; current-state validation still applies."
          fi
      - name: Run invariant and scenario regressions
        run: npm test
      - name: Audit validation dependencies
        run: npm audit --audit-level=moderate