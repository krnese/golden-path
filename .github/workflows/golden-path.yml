name: Golden Path repository hygiene

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Required by existing branch protection; this is only a whitespace check.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check patch whitespace only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Whitespace only: not engineering, delegation, authority, evidence or acceptance validation."
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid base commit SHA" >&2
              exit 1
            fi
            git diff --check "$BASE_SHA" HEAD
          else
            echo "No event base: checking the latest commit only."
            git show --format= --check HEAD
          fi

  # Golden Path v3.1 kit: the one Node.js hook script and installer (node --test, built-ins only),
  # on the supported LTS lines and on Windows (CRLF, PowerShell path). The demo app itself is Python (Linux only).
  kit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Kit tests (node --test)
        shell: bash
        run: node --test tests/kit.test.mjs
      - name: Demo smoke (adopter install, frozen hashes, scripted refusal scenario)
        if: runner.os == 'Linux'
        run: |
          bash examples/make-demo.sh "$RUNNER_TEMP/golden-path-demo"
          cd "$RUNNER_TEMP/golden-path-demo" && node simulator/refusal_scenario.mjs
