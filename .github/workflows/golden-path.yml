name: Golden Path repository hygiene

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Required by existing branch protection; this is only a whitespace check.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check patch whitespace only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Whitespace only: not engineering, delegation, authority, evidence or acceptance validation."
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid base commit SHA" >&2
              exit 1
            fi
            git diff --check "$BASE_SHA" HEAD
          else
            echo "No event base: checking the latest commit only."
            git show --format= --check HEAD
          fi

  # Golden Path v2 kit: hook scripts, installer (scratch repos incl. conflicts), plugin
  # format checks and the demo end-to-end (rigged simulator; plumbing only, not evidence).
  kit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Unit and integration tests (python3 stdlib only)
        run: python3 -m unittest discover -s tests -t tests -v
      - name: Demo smoke (adopter install + frozen task hashes)
        run: bash examples/make-demo.sh "$RUNNER_TEMP/golden-path-demo"
