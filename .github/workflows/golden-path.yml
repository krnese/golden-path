name: Golden Path repository hygiene

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Required by existing branch protection; this is only a whitespace check.
  validate:
    name: "Patch hygiene: no whitespace errors"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No whitespace errors in the patch (git diff --check)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Whitespace only: not engineering, delegation, authority, evidence or acceptance validation."
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid base commit SHA" >&2
              exit 1
            fi
            git diff --check "$BASE_SHA" HEAD
          else
            echo "No event base: checking the latest commit only."
            git show --format= --check HEAD
          fi

  # Golden Path v3.1 kit: the one Node.js hook script and installer (node --test, built-ins only),
  # on the supported LTS lines and on Windows (CRLF, PowerShell path). The demo app is Node.js too (no Python), so it runs on every OS.
  kit-tests:
    name: "Kit guarantees (${{ matrix.os }}, Node ${{ matrix.node }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Kit keeps its guarantees (packaging, installer, gate, tamper guard, acceptance, Code Owner, weakening, demo)
        shell: bash
        run: >-
          node --test
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/kit.tap"
          tests/kit.test.mjs tests/feedback-loop.test.mjs tests/installer-protected.test.mjs tests/installer-protected-match.test.mjs tests/ci-template.test.mjs
      - name: Installed kit in this repo matches plugin/ (self-install)
        shell: bash
        run: node --test --test-reporter=spec tests/self-install.test.mjs
      - name: Summarise which guarantees passed
        if: always()
        shell: bash
        run: node .github/scripts/test-summary.mjs "$RUNNER_TEMP/kit.tap" "Kit guarantees (${{ matrix.os }}, Node ${{ matrix.node }})"
      - name: "Demo works for an adopter: install, frozen hashes, scripted refusal scenario (no Python)"
        shell: bash
        run: |
          node examples/make-demo.mjs "$RUNNER_TEMP/golden-path-demo"
          cd "$RUNNER_TEMP/golden-path-demo" && node simulator/refusal_scenario.mjs
          node --test "tests/**/*.test.mjs"
          if node --test acceptance/t01.test.mjs acceptance/marketing/t05.test.mjs acceptance/marketing/t06.test.mjs > acceptance.log; then
            echo "acceptance unexpectedly green: T01, T05 and T06 are not implemented in the demo" >&2; exit 1
          fi
          grep -q "T05 test_" acceptance.log
          grep -q "T06 test_" acceptance.log
      - name: "Demo also builds with the bash wrapper (examples/make-demo.sh)"
        if: runner.os == 'Linux'
        run: bash examples/make-demo.sh "$RUNNER_TEMP/golden-path-demo-sh"
