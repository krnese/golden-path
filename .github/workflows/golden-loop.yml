name: Golden Loop

# Keeps the owner's decision in the Golden Loop (see docs/LEVEL-3-EXPERIMENTS.md).
# A PR must not be able to change the check that judges it. Issue events run this file and the script from
# the default branch. PR checks use pull_request_target, which also takes this file from the base branch, and
# check out the base commit: no code from the PR is checked out or run. The PR's description is read through
# the API with a read-only token and is never interpolated into a shell command.
on:
  issues:
    types: [closed]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  owner-decision:
    name: "Golden Loop: reopen if closed before the owner's judgment"
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'golden-loop')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    concurrency:
      group: golden-loop-issue-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Reopen if a merged change closed it before the owner's judgment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: node .github/scripts/golden-loop.mjs issue-closed --repo "$GITHUB_REPOSITORY" --issue "$ISSUE"

  evidence:
    name: "Golden Loop: evidence on the PR"
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    concurrency:
      group: golden-loop-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Check expected versus actual for each example in the PR description
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: node .github/scripts/golden-loop.mjs pr-evidence --repo "$GITHUB_REPOSITORY" --pr "$PR"
