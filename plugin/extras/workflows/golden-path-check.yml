# Installed by golden-path (opt-in --with-ci). Runs the same checks the stop gate runs, against a FIXED
# comparison commit (the PR base), never the branch's own HEAD. This is feedback, not the boundary:
# make it a required status check with branch protection and keep human review.
#
# Authorised acceptance revision. The label "golden-path:acceptance-revision" only SELECTS this path; it is not
# authorisation. Before honouring it, this workflow verifies, via the GitHub API, an APPROVED review on the
# CURRENT head commit by a Code Owner (CODEOWNERS read from the BASE commit) of every changed acceptance file.
# Otherwise it fails. The acceptance-integrity result is then reported as SKIPPED, never as a pass.
# Required repository settings (see docs/LEVEL-2.md "Changing acceptance tests on purpose"):
#   CODEOWNERS covering the acceptance paths; branch protection with "Require review from Code Owners",
#   "Dismiss stale pull request approvals when new commits are pushed", and this check as required.
name: golden-path-check
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
jobs:
  golden-path-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      # Node.js for the kit's gate (>= 22) and, for Node.js projects, your tests.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The check runs YOUR commands, so install what they need first; without this, tests that import dependencies
      # fail and the verdict is FAILED. Put your own setup in .golden-path/ci-setup.sh (pip install, dotnet restore,
      # content import, ...) so this kit file stays unmodified; otherwise a package-lock.json gets `npm ci`.
      - name: Project setup (.golden-path/ci-setup.sh, else npm ci)
        run: |
          if [ -f .golden-path/ci-setup.sh ]; then bash .golden-path/ci-setup.sh
          elif [ -f package-lock.json ]; then npm ci --ignore-scripts
          else echo "No .golden-path/ci-setup.sh or package-lock.json: no project setup run."
          fi
      - name: Golden Path check (configured commands + integrity vs the PR base commit)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVISION: ${{ contains(github.event.pull_request.labels.*.name, 'golden-path:acceptance-revision') }}
        run: |
          gate=.github/hooks/golden-path/gate.mjs
          exec >"$RUNNER_TEMP/golden-path.out"
          if [ "$REVISION" = "true" ]; then
            gh api --paginate "repos/$REPO/pulls/$PR/reviews?per_page=100" --jq '.[]' > "$RUNNER_TEMP/reviews.jsonl"
            node "$gate" authorize-acceptance-revision --base "$BASE_SHA" --head "$HEAD_SHA" --reviews "$RUNNER_TEMP/reviews.jsonl"
            node "$gate" check --base "$BASE_SHA" --authorized-acceptance-revision
          else
            node "$gate" check --base "$BASE_SHA"
          fi
      # The verdict on the PR page, so reviewers and the owner see which base, which checks and whether acceptance was
      # touched without asking anyone. The local session record (ledger) is not used and is never uploaded.
      - name: Golden Path verdict (job summary)
        if: always()
        env:
          OUT: ${{ runner.temp }}/golden-path.out
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          cat "$OUT" 2>/dev/null || true
          node - >>"$GITHUB_STEP_SUMMARY" <<'JS'
          const fs = require("node:fs");
          const text = fs.existsSync(process.env.OUT) ? fs.readFileSync(process.env.OUT, "utf8") : "";
          const blocks = [...text.replace(/\r\n/g, "\n").matchAll(/^\{\n[\s\S]*?\n\}$/gm)].flatMap((m) => {
            try { return [JSON.parse(m[0])]; } catch { return []; }
          });
          const check = blocks.find((b) => Array.isArray(b.results));
          const auth = blocks.find((b) => "authorized" in b);
          const short = (s) => String(s || "unknown").slice(0, 7);
          const L = ["## Golden Path check", ""];
          if (!check) {
            L.push("**UNVERIFIED**: no check result was produced (the step failed before or while running it). Not a pass.");
          } else {
            L.push(`Outcome: **${check.outcome}** · base \`${short(check.base_sha || process.env.BASE_SHA)}\` (PR base) · PR head \`${short(process.env.HEAD_SHA)}\``, "",
              "| Check | Result |", "|---|---|");
            const mark = (r) => r.skipped ? "skipped (not a pass)" : r.unverified ? "UNVERIFIED" : r.ok ? "passed" : "FAILED";
            for (const r of check.results) L.push(`| ${r.name} | ${mark(r)} |`);
            const acc = check.results.find((r) => r.name === "acceptance-integrity");
            if (acc) {
              const owner = acc.owner ? ` (owner: ${acc.owner})` : "";
              L.push("", acc.skipped ? `Protected acceptance changed in an authorised owner revision${owner}.`
                : acc.unverified ? `Protected acceptance could not be compared with the PR base (UNVERIFIED, not a pass)${owner}:`
                : acc.ok ? `Protected acceptance unchanged since the PR base${owner}.`
                : `Protected acceptance differs from the PR base${owner}:`);
              if (!acc.ok && !acc.skipped) L.push("", "```", String(acc.output || "").split("\n").slice(0, 20).join("\n"), "```");
            }
            if (check.failed_tests?.length) L.push("", `Failing tests (${check.failed_tests.length}):`, ...check.failed_tests.slice(0, 50).map((t) => `- ${t}`));
          }
          if (auth) {
            L.push("", auth.authorized ? "Acceptance revision authorised by: " +
              auth.files.map((f) => `${f.file} (${f.approved_by.join(", ")})`).join("; ")
              : "Acceptance revision NOT authorised:", ...(auth.problems || []).map((p) => `- ${p}`));
          }
          L.push("", "_Feedback for reviewers, not approval: passing shows the owner's written examples are met, " +
            "not that the result is what the owner wanted. Compare the real output with the examples._");
          process.stdout.write(L.join("\n") + "\n");
          JS
